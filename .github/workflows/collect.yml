name: collect

on:
  workflow_call:

jobs:
  collect:
    name: Commit generated files
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download linux-x64
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: prebuilt/linux/x64

      - name: Download linux-arm64
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: prebuilt/linux/arm64

      - name: Download macos-x64
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: prebuilt/macos/x64
      
      - name: Download macos-arm64
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: prebuilt/macos/arm64
      
      - name: Download windows-x64
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: prebuilt/windows/x64
      
      - name: Download android-arm32
        uses: actions/download-artifact@v4
        with:
          name: android-arm32
          path: prebuilt/android/arm32
      
      - name: Download android-arm64
        uses: actions/download-artifact@v4
        with:
          name: android-arm64
          path: prebuilt/android/arm64
      
      - name: Download android-x64
        uses: actions/download-artifact@v4
        with:
          name: android-x64
          path: prebuilt/android/x64

      - name: Download ios-simulator-arm64
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-arm64
          path: prebuilt/ios/simulator/arm64/
      
      - name: Download ios-device-arm64
        uses: actions/download-artifact@v4
        with:
          name: ios-device-arm64
          path: prebuilt/ios/device/arm64/
        
      - name: Download bindings
        uses: actions/download-artifact@v4
        with:
          name: bindings
          path: lib

      - name: Git status
        run: git status .
      
      - name: Commit and push generated files
        run: |
          git config user.name "github-actions-bot"
          git config user.email "github-actions-bot@noreply.local"

          git add prebuilt
          git add lib/api.g.dart
          
          git diff --staged --quiet || git commit -m "build: update all generated sources"

          git push origin HEAD:${{ github.ref_name }}
