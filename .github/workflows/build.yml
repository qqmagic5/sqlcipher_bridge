name: build

on:
  push:
    branches:
      - main
    
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  bindings:
    name: bindings
    uses: ./.github/workflows/bindings.yml
  
  linux-build:
    name: linux-build
    uses: ./.github/workflows/linux.yml
  
  macos-build:
    name: macos-build
    uses: ./.github/workflows/macos.yml
  
  windows-build:
    name: windows-build
    uses: ./.github/workflows/windows.yml
  
  android-build:
    name: android-build
    uses: ./.github/workflows/android.yml
  
  ios-build:
    name: ios-build
    uses: ./.github/workflows/ios.yml
  
  linux-test:
    name: linux-test
    needs:
      - linux-build
      - bindings
    uses: ./.github/workflows/linux_test.yml
  
  macos-test:
    name: macos-test
    needs:
      - macos-build
      - bindings
    uses: ./.github/workflows/macos_test.yml
  
  windows-test:
    name: windows-test
    needs:
      - windows-build
      - bindings
    uses: ./.github/workflows/windows_test.yml
  
  android-test:
    name: android-test
    needs:
      - android-build
      - bindings
    uses: ./.github/workflows/android_test.yml
  
  ios-test:
    name: ios-test
    needs:
      - ios-build
      - bindings
    uses: ./.github/workflows/ios.yml
  
  collect:
    name: Commit generated sources and libraries
    needs:
      - bindings
      - linux-build
      - macos-build
      - windows-build
      - android-build
      - ios-build
      - linux-test
      - macos-test
      - windows-test
      - android-test
      - ios-test
    uses: ./.github/workflows/collect.yml
